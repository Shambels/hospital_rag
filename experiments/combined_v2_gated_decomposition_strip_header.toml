# experiments/combined_v2_gated_decomposition_strip_header.toml — gated decomposition: split only the questions needing a record AND a notice
name = "combined_v2_gated_decomposition_strip_header"

[chunking]
max_tokens = 256
overlap = 0
patient_line = true
strip_header = true         # drop the documents' header chunks (hospital, identity, date, author, disclaimer)

[embedder]
model = "bge-m3"
query_instruction = ""

[search]
method = "hybrid"          # dense, sparse or hybrid
fusion = "rrf"             # hybrid only: rrf or dbsf
rrf_k = 60                 # rrf only
candidates = 30
top_k = 5

[reranker]
model = "bge-reranker"

[generation]
enabled = true              # false: retrieval only, for experiments the deterministic metrics measure
model = "qwen3.5-9b"        # served name (llama-server -a)
system_prompt = "prompts/combined_v2.txt"
temperature = 0.0
top_p = 1.0
top_k = 40                  # sampling: candidate tokens at each step, not the number of chunks
max_tokens = 512

[decomposition]
enabled = true              # the LLM splits a question into sub-questions, one search + rerank each
max_subquestions = 3
gate = true                 # split only the questions that need a patient's record AND a drug notice
