# experiments/chunks_128_overlap_32.toml — §2: chunk size and overlap, retrieval only
name = "chunks_128_overlap_32"

[chunking]
max_tokens = 128
overlap = 32
patient_line = true

[embedder]
model = "bge-m3"
query_instruction = ""

[search]
method = "hybrid"          # dense, sparse or hybrid
fusion = "rrf"             # hybrid only: rrf or dbsf
rrf_k = 60                 # rrf only
candidates = 30
top_k = 5

[reranker]
model = "bge-reranker"

[generation]
enabled = false             # false: retrieval only, for experiments the deterministic metrics measure
model = "qwen3.5-9b"        # served name (llama-server -a)
system_prompt = "prompts/strict.txt"
temperature = 0.0
top_p = 1.0
top_k = 40                  # sampling: candidate tokens at each step, not the number of chunks
max_tokens = 512