# experiments/combined_v2_top_k_10.toml — chunks 256/0 + combined_v2 prompt + 10 chunks sent to the LLM
name = "combined_v2_top_k_10"

[chunking]
max_tokens = 256
overlap = 0
patient_line = true

[embedder]
model = "bge-m3"
query_instruction = ""

[search]
method = "hybrid"          # dense, sparse or hybrid
fusion = "rrf"             # hybrid only: rrf or dbsf
rrf_k = 60                 # rrf only
candidates = 30
top_k = 10

[reranker]
model = "bge-reranker"

[generation]
enabled = true              # false: retrieval only, for experiments the deterministic metrics measure
model = "qwen3.5-9b"        # served name (llama-server -a)
system_prompt = "prompts/combined_v2.txt"
temperature = 0.0
top_p = 1.0
top_k = 40                  # sampling: candidate tokens at each step, not the number of chunks
max_tokens = 512